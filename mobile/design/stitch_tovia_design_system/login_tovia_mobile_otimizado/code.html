<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Tovia - Gestão de Eventos</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

            theme: {
                extend: {
                    "colors": {
                        "danger": "#ef4444",
                        "surface": "#f8faf8",
                        "secondary-container": "#64f9bc",
                        "primary-dark": "#0d5c32",
                        "on-secondary-fixed-variant": "#005137",
                        "background": "#f8faf8",
                        "on-surface-variant": "#3f4940",
                        "border-dark": "#243328",
                        "surface-variant": "#e1e3e1",
                        "on-secondary-fixed": "#002114",
                        "on-primary-fixed": "#00210d",
                        "tertiary-fixed": "#ffddb8",
                        "on-secondary-container": "#00714e",
                        "surface-container-lowest": "#ffffff",
                        "primary-light": "#e8f5ee",
                        "on-primary": "#ffffff",
                        "primary-fixed-dim": "#80d99a",
                        "surface-container-low": "#f2f4f2",
                        "secondary": "#006c4b",
                        "tertiary-container": "#965e00",
                        "card-dark": "#111a14",
                        "surface-tint": "#006d3a",
                        "on-surface": "#191c1b",
                        "secondary-fixed": "#68fcbf",
                        "on-tertiary-container": "#ffe8d1",
                        "on-secondary": "#ffffff",
                        "inverse-primary": "#80d99a",
                        "outline": "#6f7a6f",
                        "secondary-fixed-dim": "#45dfa4",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#ffb95f",
                        "inverse-on-surface": "#eff1ef",
                        "primary-fixed": "#9bf6b5",
                        "primary-container": "#1a7a45",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#2e3130",
                        "error": "#ba1a1a",
                        "tertiary": "#754900",
                        "success": "#22c55e",
                        "on-primary-fixed-variant": "#00522a",
                        "on-tertiary-fixed": "#2a1700",
                        "on-tertiary-fixed-variant": "#653e00",
                        "card-light": "#ffffff",
                        "surface-container": "#eceeec",
                        "warning": "#f59e0b",
                        "surface-dim": "#d8dad9",
                        "on-background": "#191c1b",

                    "borderRadius": {

                    "spacing": {

                    "fontFamily": {

                    "fontSize": {
                        "helper-text": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],

                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.08em", "fontWeight": "600" }],
                        "body-md": ["15px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg": ["26px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "numeric-data": ["16px", { "lineHeight": "20px", "fontWeight": "600" }]
                    }
                },
            },
        }
    </script>
<style>
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #0d1a12;
            font-family: 'Inter', sans-serif;
            min-height: 100dvh;
        }

        .main-gradient-bg {
            background: radial-gradient(circle at 50% 0%, #1a3a2a 0%, #0d1a12 80%);
        }

        .glass-card {
            background: rgba(25, 28, 27, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .theme-input:focus {
            outline: none;
            border-color: #9bf6b5;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 4px rgba(155, 246, 181, 0.1);
        }
        
        .divider-line {
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
            flex-grow: 1;
        }
    </style>
</head>
<body class="flex flex-col items-center main-gradient-bg p-container-margin py-12">
<!-- Top Branding -->
<header class="flex flex-col items-center mb-10 text-center w-full max-w-md">
<div class="flex items-center gap-3 mb-8">
<h1 class="font-display-lg text-display-lg text-on-primary">tovia</h1>
<div class="h-6 w-[1.5px] bg-white/30"></div>
<span class="font-label-caps text-label-caps text-on-primary/90 uppercase tracking-[0.2em]">Gestão de Eventos</span>
</div>
<div class="space-y-3">
<h2 class="font-headline-md text-[24px] leading-tight text-on-primary">Bem-vindo de volta!</h2>
<p class="font-body-md text-body-md text-on-primary/80">Gestão de eventos simplificada e profissional.</p>
</div>
</header>
<!-- Login Card -->
<main class="w-full max-w-md glass-card rounded-3xl p-6 md:p-8 shadow-2xl">
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-primary/90 uppercase tracking-widest block ml-1 text-on-primary" for="email">E-mail</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-primary/50 group-focus-within:text-primary-fixed transition-colors">mail</span>
<input class="w-full h-[56px] bg-white/5 border-white/10 rounded-xl pl-12 pr-4 text-on-primary theme-input transition-all font-body-md placeholder-on-primary/70" id="email" placeholder="seu@email.com" type="email">
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-primary/90 uppercase tracking-widest block ml-1 text-on-primary" for="password">Senha</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-primary/50 group-focus-within:text-primary-fixed transition-colors">lock</span>
<input class="w-full h-[56px] bg-white/5 border-white/10 rounded-xl pl-12 pr-4 text-on-primary theme-input transition-all font-body-md placeholder-on-primary/70" id="password" placeholder="••••••••" type="password">
</div>
<div class="text-right">
<a class="font-helper-text text-helper-text text-primary-fixed hover:text-on-primary-container underline underline-offset-4 transition-colors inline-block py-2" href="#">Esqueceu sua senha?</a>
</div>
</div>
<!-- Primary Login Button -->
<button class="w-full h-[56px] bg-[#1a7a45] hover:bg-primary-container text-white font-headline-md text-headline-md rounded-full flex items-center justify-center gap-2 transition-all active:scale-[0.98] shadow-lg group mt-4" type="submit">
                ENTRAR
                <span class="material-symbols-outlined transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 my-8">
<div class="divider-line"></div>
<span class="font-label-caps text-label-caps text-on-primary/40 uppercase">ou</span>
<div class="divider-line"></div>
</div>
<!-- Social Login -->
<button class="w-full h-[56px] bg-white/5 hover:bg-white/10 border border-white/10 text-on-primary font-numeric-data text-numeric-data rounded-full flex items-center justify-center gap-3 transition-all active:scale-[0.98] mb-8">
<svg class="w-5 h-5" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
            Entrar com Google
        </button>
<!-- Footer -->
<footer class="text-center">
<p class="font-body-md text-body-md text-on-primary/70">
                Ainda não tem conta? 
                <a class="text-primary-fixed font-bold hover:underline underline-offset-4 transition-all ml-1 inline-block py-2" href="#">Criar conta</a>
</p>
</footer>
</main>
<script>
        // Subtle interactive lighting for desktop or hover users
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            document.body.style.background = `radial-gradient(circle at ${x}% ${y}%, #1a3a2a 0%, #0d1a12 80%)`;
        });
    </script>


</body></html>
