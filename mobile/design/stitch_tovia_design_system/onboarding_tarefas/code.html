<script>
        // Micro-interaction: Subtle hover/float effect for illustration elements
        document.addEventListener('mousemove', (e) => {
            const amount = 10;
            const x = (e.clientX / window.innerWidth - 0.5) * amount;
            const y = (e.clientY / window.innerHeight - 0.5) * amount;
            
            const cards = document.querySelectorAll('.rotate-2, .-rotate-3');
            cards.forEach((card, index) => {
                const multiplier = (index + 1) * 0.5;
                card.style.transform = `translate(${x * multiplier}px, ${y * multiplier}px) ${card.classList.contains('rotate-2') ? 'rotate(2deg)' : 'rotate(-3deg)'}`;
            });
        });

        // Click interaction for checking the box
        const checkIcon = document.querySelector('.material-symbols-outlined.text-white');
        const checkContainer = checkIcon.parentElement;
        
        checkContainer.addEventListener('click', () => {
            checkContainer.classList.toggle('bg-primary');
            checkContainer.classList.toggle('border-primary');
            checkContainer.classList.toggle('bg-white');
            checkIcon.classList.toggle('opacity-0');
        });
    </script>
