<!-- Micro-interaction Scripts -->
<script>
        function selectAssignee(element) {
            // Reset all rings
            document.querySelectorAll('.avatar-ring-selected').forEach(el => {
                el.classList.remove('avatar-ring-selected');
                el.classList.add('ring-transparent');
                el.nextElementSibling.classList.replace('text-primary', 'text-outline');
            });
            
            // Add ring to selected
            const ringDiv = element.querySelector('div');
            ringDiv.classList.remove('ring-transparent');
            ringDiv.classList.add('avatar-ring-selected');
            element.querySelector('span').classList.replace('text-outline', 'text-primary');

            // Haptic-like feedback
            if ('vibrate' in navigator) {
                navigator.vibrate(5);
            }
        }

        function setStatus(element) {
            const buttons = element.parentElement.querySelectorAll('button');
            buttons.forEach(btn => {
                btn.classList.remove('bg-primary', 'text-white', 'shadow-md');
                btn.classList.add('text-outline');
            });
            
            element.classList.remove('text-outline');
            element.classList.add('bg-primary', 'text-white', 'shadow-md');

            // Haptic-like feedback
            if ('vibrate' in navigator) {
                navigator.vibrate(10);
            }
        }

        // Handle focus states for inputs
        const inputs = document.querySelectorAll('input, textarea');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label')?.classList.replace('text-on-surface-variant', 'text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label')?.classList.replace('text-primary', 'text-on-surface-variant');
            });
        });
    </script>
