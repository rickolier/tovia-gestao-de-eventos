<script>
        // Simple logic for row background toggle on checkbox change
        document.querySelectorAll('.custom-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const row = this.closest('label');
                const visual = row.querySelector('.checkbox-visual');
                if (this.checked) {
                    row.classList.add('row-checked');
                    visual.classList.remove('border-outline-variant');
                    visual.classList.add('border-primary');
                } else {
                    row.classList.remove('row-checked');
                    visual.classList.add('border-outline-variant');
                    visual.classList.remove('border-primary');
                }
            });
        });
