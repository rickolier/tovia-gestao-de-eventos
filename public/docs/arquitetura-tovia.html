<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Arquitetura Tovia — Mapa</title>
<style>
:root {
  --bg: #f5f5f3;
  --card: #fff;
  --text: #1a1a18;
  --muted: #888;
  --border: #ddd;
  --line: #ccc;
  --primary: #FF6B1A;
  --blue: #2563eb;
  --green: #16a34a;
  --purple: #7c3aed;
  --red: #dc2626;
  --yellow: #d97706;
  --teal: #0d9488;
  --pink: #db2777;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#111110; --card:#1e1e1c; --text:#f5f5f3; --muted:#888; --border:#333; --line:#444; }
}
:root[data-theme="dark"] { --bg:#111110; --card:#1e1e1c; --text:#f5f5f3; --muted:#888; --border:#333; --line:#444; }
:root[data-theme="light"] { --bg:#f5f5f3; --card:#fff; --text:#1a1a18; --muted:#888; --border:#ddd; --line:#ccc; }

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); overflow:hidden; height:100vh; width:100vw; }

/* ─── TOOLBAR ─── */
.toolbar {
  position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:20;
  background:var(--card); border:1px solid var(--border); border-radius:12px;
  padding:6px 12px; display:flex; gap:8px; align-items:center;
  box-shadow:0 4px 20px rgba(0,0,0,.12);
}
.toolbar button {
  background:none; border:1px solid var(--border); border-radius:8px;
  color:var(--text); font-size:16px; width:32px; height:32px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.toolbar button:hover { background:var(--bg); }
.toolbar .title { font-size:13px; font-weight:800; color:var(--primary); padding:0 8px; letter-spacing:-0.3px; }
.toolbar .sep { width:1px; height:20px; background:var(--border); }
.toolbar .hint { font-size:11px; color:var(--muted); }

/* ─── CANVAS ─── */
.canvas {
  width:100%; height:100%; position:relative; cursor:grab;
}
.canvas.grabbing { cursor:grabbing; }
.world { position:absolute; top:0; left:0; transform-origin:0 0; }

/* ─── SVG LINES ─── */
svg.lines { position:absolute; top:0; left:0; pointer-events:none; overflow:visible; }

/* ─── NODES ─── */
.node {
  position:absolute;
  background:var(--card);
  border:2px solid var(--border);
  border-radius:14px;
  padding:10px 16px;
  white-space:nowrap;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  user-select:none;
  transition:box-shadow .15s, border-color .15s;
  display:flex;
  align-items:center;
  gap:8px;
}
.node:hover { box-shadow:0 4px 16px rgba(0,0,0,.12); }
.node.expanded { border-color:var(--primary); }
.node .dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.node .label { line-height:1.3; }
.node .sub { font-size:10px; font-weight:500; color:var(--muted); display:block; }
.node .toggle {
  font-size:10px; color:var(--muted); margin-left:4px;
  transition:transform .2s;
}
.node.expanded .toggle { transform:rotate(90deg); }

/* root node */
.node.root {
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
  font-size:18px;
  font-weight:900;
  padding:16px 28px;
  border-radius:20px;
  letter-spacing:-0.5px;
}
.node.root .sub { color:rgba(255,255,255,.7); }

/* level 1 */
.node.l1 { font-size:13px; padding:12px 18px; border-radius:16px; }

/* ─── MINIMAP ─── */
.minimap {
  position:fixed; bottom:16px; right:16px; z-index:20;
  width:180px; height:120px;
  background:var(--card); border:1px solid var(--border); border-radius:10px;
  overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,.1);
}
.minimap canvas { width:100%; height:100%; }
.minimap-viewport {
  position:absolute; border:2px solid var(--primary); border-radius:2px;
  pointer-events:none;
}

@media print {
  .toolbar, .minimap { display:none!important; }
  body { overflow:visible; height:auto; }
  .canvas { overflow:visible; height:auto; }
}
</style>
</head>

// ─── LAYOUT ENGINE ───
const NODE_H = 44;
const NODE_PAD = 8;
const LEVEL_GAP = 200;
const SIBLING_GAP = 6;

const state = {};
const nodeEls = {};

function initState(node) {
  state[node.id] = { expanded: false };
  if (node.children) node.children.forEach(c => initState(c));
}
initState(TREE);
state.root.expanded = true;

function measureLabel(node) {
  const label = node.label + (node.sub ? '  ' + node.sub : '');
  return Math.max(100, label.length * 7 + 60);
}

function layoutTree(node, x, y, depth) {
  const w = measureLabel(node);
  const result = { id:node.id, x, y, w, h:NODE_H, depth, node, children:[] };
  if (!state[node.id].expanded || !node.children) {
    result.totalH = NODE_H;
    return result;
  }
  let cy = y;
  for (const child of node.children) {
    const childLayout = layoutTree(child, x + w + LEVEL_GAP, cy, depth+1);
    result.children.push(childLayout);
    cy += childLayout.totalH + SIBLING_GAP;
  }
  const totalChildH = cy - y - SIBLING_GAP;
  result.totalH = Math.max(NODE_H, totalChildH);
  // center parent vertically
  if (result.children.length > 0) {
    const firstY = result.children[0].y + result.children[0].h/2;
    const lastY = result.children[result.children.length-1].y + result.children[result.children.length-1].h/2;
    result.y = (firstY + lastY) / 2 - NODE_H/2;
  }
  return result;
}

function flattenLayout(layout, arr=[]) {
  arr.push(layout);
  layout.children.forEach(c => flattenLayout(c, arr));
  return arr;
}

// ─── RENDERING ───
const world = document.getElementById('world');
const svgLines = document.getElementById('lines');

function render() {
  const layout = layoutTree(TREE, 60, 60, 0);
  const flat = flattenLayout(layout);

  // clear old
  Object.keys(nodeEls).forEach(k => { if (nodeEls[k].parentNode) nodeEls[k].remove(); delete nodeEls[k]; });
  svgLines.innerHTML = '';

  // compute bounding box
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  flat.forEach(n => {
    minX = Math.min(minX, n.x);
    minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + n.w);
    maxY = Math.max(maxY, n.y + n.h);
  });
  svgLines.style.width = (maxX+100)+'px';
  svgLines.style.height = (maxY+100)+'px';

  // draw lines
  flat.forEach(n => {
    n.children.forEach(child => {
      const x1 = n.x + n.w;
      const y1 = n.y + n.h/2;
      const x2 = child.x;
      const y2 = child.y + child.h/2;
      const mx = (x1+x2)/2;
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d', `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
      path.setAttribute('fill','none');
      path.setAttribute('stroke', getComputedStyle(document.documentElement).getPropertyValue('--line').trim());
      path.setAttribute('stroke-width','2');
      svgLines.appendChild(path);
    });
  });

  // draw nodes
  flat.forEach(n => {
    const el = document.createElement('div');
    el.className = 'node' + (n.depth===0?' root':'') + (n.depth===1?' l1':'') + (state[n.id].expanded?' expanded':'');
    el.style.left = n.x+'px';
    el.style.top = n.y+'px';
    if (n.depth > 0) {
      el.innerHTML = `<span class="dot" style="background:${n.node.color}"></span>`;
    }
    let html = `<span class="label">${n.node.label}`;
    if (n.node.sub) html += `<span class="sub">${n.node.sub}</span>`;
    html += '</span>';
    if (n.node.children) html += '<span class="toggle">▶</span>';
    el.innerHTML += html;

    el.addEventListener('click', () => {
      if (!n.node.children) return;
      state[n.id].expanded = !state[n.id].expanded;
      render();
    });

    world.appendChild(el);
    nodeEls[n.id] = el;
  });
}

// ─── PAN & ZOOM ───
let scale = 0.85, panX = 0, panY = 80;
function applyTransform() {
  world.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
}

const canvas = document.getElementById('canvas');
let dragging = false, lastMX, lastMY;

canvas.addEventListener('pointerdown', e => {
  if (e.target.closest('.node')) return;
  dragging = true; lastMX = e.clientX; lastMY = e.clientY;
  canvas.classList.add('grabbing');
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  panX += e.clientX - lastMX;
  panY += e.clientY - lastMY;
  lastMX = e.clientX; lastMY = e.clientY;
  applyTransform();
});
canvas.addEventListener('pointerup', () => { dragging = false; canvas.classList.remove('grabbing'); });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const ns = Math.max(0.15, Math.min(3, scale * delta));
  panX = mx - (mx - panX) * (ns / scale);
  panY = my - (my - panY) * (ns / scale);
  scale = ns;
  applyTransform();
}, { passive: false });

function zoomBy(factor) {
  const cx = window.innerWidth/2, cy = window.innerHeight/2;
  const ns = Math.max(0.15, Math.min(3, scale * factor));
  panX = cx - (cx - panX) * (ns / scale);
  panY = cy - (cy - panY) * (ns / scale);
  scale = ns;
  applyTransform();
}
function resetView() {
  scale = 0.85; panX = 0; panY = 80;
  applyTransform();
}
function expandAll() {
  Object.keys(state).forEach(k => state[k].expanded = true);
  render();
}
function collapseAll() {
  Object.keys(state).forEach(k => state[k].expanded = false);
  state.root.expanded = true;
  render();
}

// ─── INIT ───
render();
applyTransform();
</script>
</body>
</html>
